<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ludex</title>
        <!--
          Set data-theme and the accent before the stylesheet loads so
          the first paint already reflects the user's choice. Without
          this the page briefly renders in the default palette before
          the Svelte runtime gets a chance to apply the saved
          preference, which is jarring on OLED displays.

          `ludex-theme` holds the *mode* (dark / light / auto) while
          data-theme holds the scheme it resolves to. Anything saved
          by an older build is one of the two concrete values and
          still reads correctly.
        -->
        <script>
            (function () {
                try {
                    var mode = localStorage.getItem('ludex-theme');
                    if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') {
                        mode = 'auto';
                    }
                    var prefersDark =
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.documentElement.dataset.theme =
                        mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode;
                    var accent = localStorage.getItem('ludex-accent');
                    if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
                        document.documentElement.style.setProperty('--raw', accent);
                    }
                    var savedFmt = localStorage.getItem('ludex-timestamp-format');
                    document.documentElement.dataset.timestampFormat =
                        savedFmt === 'iso' ||
                        savedFmt === 'dmy' ||
                        savedFmt === 'relative' ||
                        savedFmt === 'short'
                            ? savedFmt
                            : 'short';
                } catch (_) {
                    // localStorage blocked; fall through with the
                    // default light palette / short timestamps.
                }
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
