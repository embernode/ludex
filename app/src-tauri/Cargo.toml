[package]
name = "ludex-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true
description = "Tauri desktop UI for ludex"

[lib]
name = "ludex_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
# Linux-only app; the Tauri `tray-icon` feature pulls in the
# abandoned libappindicator-rs crate (last commit 2022) that wraps
# the deprecated libayatana-appindicator C library. We render the
# tray through `ksni` (pure-Rust StatusNotifierItem) instead — see
# `src/tray.rs` — so the feature stays off.
# `image-png` enables the PNG decoder inside `tauri::image::Image`,
# which `src/tray.rs` uses to decode both icon variants at runtime
# for the theme-aware tray + window icon.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing = { workspace = true }
zbus = { workspace = true }
ksni = "0.3"

ludex-dbus-types = { path = "../../crates/ludex-dbus-types" }

[dev-dependencies]
# The `test` feature exposes `tauri::test::mock_app` + `MockRuntime` so
# the tray's event→state wiring can be unit-tested without a real
# window, D-Bus host, or StatusNotifierItem service. Feature-unified
# only under `cargo test`; normal builds don't pull it in.
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
