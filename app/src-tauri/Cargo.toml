[package]
name = "ludex-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
description = "Tauri desktop UI for ludex"

[lib]
name = "ludex_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
# Linux-only app; the Tauri `tray-icon` feature pulls in the
# abandoned libappindicator-rs crate (last commit 2022) that wraps
# the deprecated libayatana-appindicator C library. We render the
# tray through `ksni` (pure-Rust StatusNotifierItem) instead — see
# `src/tray.rs` — so the feature stays off.
tauri = { version = "2" }
tauri-plugin-log = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing = { workspace = true }
zbus = { workspace = true }
ksni = "0.3"

ludex-dbus-types = { path = "../../crates/ludex-dbus-types" }

[lints]
workspace = true
