<?xml version="1.0" encoding="UTF-8"?>
<!--
  ludex brand mark.

  A 32x32 grid, chosen so every stroke lands on whole pixels at 16, 32
  and 64. The ring is a clock face with four ticks cut out of a heavy
  stroke; the play triangle sits inside it.

  Colour rule: the ring is `currentColor`, so a host that themes text
  themes the mark with it. Green appears only on the triangle, and it
  is a fixed brand green — it deliberately does not follow the app's
  accent picker, because the mark should not change colour when the
  user retints the interface.

  Rasterisations under assets/ substitute a concrete colour for
  `currentColor`; see assets/README.md for the commands.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="ludex-mark-title">
  <title id="ludex-mark-title">ludex</title>
  <!--
    r=12 with a 4-wide stroke gives a 75.398 circumference, which the
    dash pattern divides almost exactly: 4 x (15.35 + 3.5) = 75.4.
    The half-gap offset centres the four gaps on 0/90/180/270 degrees.
  -->
  <circle
    cx="16"
    cy="16"
    r="12"
    fill="none"
    stroke="#7a838a"
    stroke-width="4"
    stroke-dasharray="15.35 3.5"
    stroke-dashoffset="-1.75"
  />
  <!-- Height 11.2, nudged 0.4 left of centre so it reads as centred. -->
  <path d="M12.9 10.4 L21.7 16 L12.9 21.6 Z" fill="#6ec46e" />
</svg>
