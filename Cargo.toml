[workspace]
resolver = "2"
members = [
    "crates/ludex-core",
    "crates/ludex-daemon",
    "crates/ludex-cli",
    "crates/ludex-dbus-types",
    "crates/ludex-enrich",
    "app/src-tauri",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/embernode/ludex"
authors = ["embernode and contributors"]
readme = "README.md"
# Workspace crates are internal to ludex — `ludex-cli` /
# `ludex-daemon` / `ludex-gui` ship as binaries through PKGBUILD
# (published on GitHub Releases), and `ludex-core` / `ludex-enrich` /
# `ludex-dbus-types` are pure implementation details. Marking
# the whole workspace as non-publishable makes that explicit and
# lets cargo-deny's `allow-wildcard-paths` apply to our internal
# `path = "../foo"` deps without a per-crate exemption.
publish = false

[workspace.dependencies]
# Core async
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync"] }

# D-Bus (tokio runtime; no async-io)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

# Errors
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Linux syscall wrappers (pidfd, process, fs, clock_gettime)
rustix = { version = "1", default-features = false, features = ["std", "process", "fs", "time"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "time", "macros", "migrate"] }

# Time
time = { version = "0.3", default-features = false, features = ["std", "serde", "formatting", "parsing", "macros"] }

# Enum ergonomics
strum = { version = "0.28", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PE parser (for Proton/Wine PE FileVersionInfo extraction)
pelite = { version = "0.10", default-features = false, features = ["std"] }

# XDG `.desktop` entry parser. Default features in 0.8 pull in
# gettext-rs, which wraps libintl/libgettext to translate Name=. We
# only read untranslated names (passing an empty locale list to
# `entry.name(&[])`), so we keep default-features off and avoid the
# C dep entirely.
freedesktop-desktop-entry = { version = "0.8", default-features = false }

# Filesystem watching (inotify on Linux)
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# Wayland client for ext-idle-notify-v1 (pure Rust, no libwayland link).
# wayland-protocols 0.32.6 is the floor that vendors ext-idle-notify-v1
# at interface version 2 (`get_input_idle_notification`); the `staging`
# feature is required for the ext namespace to exist at all.
wayland-client = "0.31"
wayland-protocols = { version = "0.32.6", default-features = false, features = ["staging", "client"] }

# Stream combinators used by zbus property streams
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Test-only helpers
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
# `deny` rather than `forbid` so individual call sites can opt in
# with a #[allow(unsafe_code, reason = "...")] and a SAFETY comment.
# Today this unblocks the WebKitGTK env-var shim in ludex-gui;
# every other crate is unsafe-free.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows — each paired with a justification.
# These pedantic lints are frequently wrong or noisy in application code.
module-name-repetitions = "allow"     # triggers on perfectly-named submodules
must-use-candidate = "allow"          # noisy for internal APIs
missing-errors-doc = "allow"          # documented separately where it matters
missing-panics-doc = "allow"          # same
cast-sign-loss = "allow"              # intentional where clock math / byte sizes meet
cast-possible-truncation = "allow"    # same
cast-possible-wrap = "allow"          # same
future-not-send = "allow"             # zbus futures are !Send; fine in single-threaded runtimes
option-if-let-else = "allow"          # stylistic; often less readable rewritten
doc-markdown = "allow"                # over-aggressive on brand names (KWin, Lutris); backticks also render as literal in clap --help output
struct-field-names = "allow"          # fires on category structs (Icons { icon_16, icon_32, ... }) where the prefix is the intent

[profile.dev]
debug = "line-tables-only"            # backtraces keep file:line; full DWARF costs tens of GB across the Tauri tree

[profile.dev.package."*"]
debug = false                         # dependency debug info is never stepped through

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
